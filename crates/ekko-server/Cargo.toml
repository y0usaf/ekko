[package]
name = "ekko-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["builtins", "wasm"]
builtins = ["dep:ekko-builtins"]
# The WASM extension + config bridge through the shared cordis kernel.
wasm = ["ekko-ext/wasm"]

[dependencies]
ekko-err.workspace = true
libc.workspace = true
log = { workspace = true, features = ["std"] }
kernel = { path = "../kernel" }
ekko-builtins = { workspace = true, optional = true }
ekko-config.workspace = true
ekko-event.workspace = true
ekko-ext.workspace = true
ekko-proto.workspace = true
ekko-paths.workspace = true
ekko-pty.workspace = true
ekko-resurrection.workspace = true
signal-hook.workspace = true
vt100.workspace = true

[dev-dependencies]
ekko-builtins.workspace = true
ekko-tmp.workspace = true
wat = "1"

[lints]
workspace = true

