[package]
name = "ekko"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ekko"
path = "src/main.rs"

[features]
default = ["builtins", "keycast", "wasm"]
# The stock feature set. Building without it yields the bare harness:
# attach, raw key passthrough, full-screen grid — nothing else.
builtins = ["ekko-client/builtins", "ekko-server/builtins"]
# The keycast extension (WS8): a non-builtin extension compiled in from its
# own crate, registered through the same public API.
keycast = ["ekko-client/keycast"]
# The WASM extension + config bridge (WS-WASM): user extensions and config
# loaded as compiled .wasm through the shared cordis kernel.
wasm = ["ekko-client/wasm", "ekko-server/wasm"]

[dependencies]
ekko-err.workspace = true
log.workspace = true
ekko-client.workspace = true
ekko-config.workspace = true
ekko-proto.workspace = true
ekko-server.workspace = true
serde_json.workspace = true

[dev-dependencies]
ekko-tmp.workspace = true

[lints]
workspace = true

