[package]
name = "ekko-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["builtins", "keycast", "wasm"]
builtins = ["dep:ekko-builtins"]
keycast = ["dep:ekko-keycast"]
# The WASM extension + config bridge through the shared cordis kernel.
wasm = ["ekko-ext/wasm"]

[dependencies]
ekko-err.workspace = true
libc.workspace = true
log.workspace = true
ekko-builtins = { workspace = true, optional = true }
ekko-keycast = { workspace = true, optional = true }
ekko-config.workspace = true
ekko-ext.workspace = true
ekko-grid.workspace = true
kernel.workspace = true
ekko-paths.workspace = true
ekko-proto.workspace = true
ekko-resurrection.workspace = true
ekko-tui.workspace = true
serde_json.workspace = true
signal-hook.workspace = true

[dev-dependencies]
ekko-builtins.workspace = true

[lints]
workspace = true

